<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>League of Legends ADC Champions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background: #010a13;
            color: #a09b8c;
        }

        .page-header {
            padding: 2.5rem 1rem 1.75rem;
            margin-bottom: 1.5rem;
            border-radius: 1rem;
            background: radial-gradient(ellipse at top, rgba(10, 200, 185, .14), transparent 65%), radial-gradient(ellipse at bottom, rgba(200, 170, 110, .10), transparent 70%);
        }

        .page-label {
            color: #0ac8b9;
            font-size: .8rem;
            font-weight: 600;
            letter-spacing: .45em;
            text-transform: uppercase;
            margin-bottom: .5rem;
        }

        .page-title {
            font-size: clamp(2.25rem, 6vw, 4rem);
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin: 0;
            background: linear-gradient(180deg, #f0e6d2 10%, #c8aa6e 55%, #785a28 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 2px 12px rgba(200, 170, 110, .35));
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .75rem;
            margin: 1rem auto;
            max-width: 320px;
        }

        .divider span {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c8aa6e);
        }

        .divider span:last-child {
            background: linear-gradient(90deg, #c8aa6e, transparent);
        }

        .divider i {
            width: 10px;
            height: 10px;
            background: #c8aa6e;
            transform: rotate(45deg);
            box-shadow: 0 0 10px rgba(200, 170, 110, .8);
        }

        .page-sub {
            color: #a09b8c;
            letter-spacing: .3em;
            text-transform: uppercase;
            font-size: .9rem;
        }

        .search-wrap {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #c8aa6e;
            pointer-events: none;
        }

        .search-input {
            padding-left: 3rem;
            border-radius: 50rem;
        }

        .result-count {
            color: #785a28;
            font-size: .8rem;
            letter-spacing: .2em;
            text-transform: uppercase;
        }

        .champ-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #091428;
            border: 1px solid #463714;
            border-radius: .5rem;
            overflow: hidden;
            transition: transform .2s, border-color .2s, box-shadow .2s;
        }

        .champ-card:hover {
            transform: translateY(-4px);
            border-color: #c8aa6e;
            box-shadow: 0 0 18px rgba(200, 170, 110, .25) !important;
        }

        .champ-img {
            height: 200px;
            width: 100%;
            object-fit: cover;
            object-position: top;
            background: #1e2328;
        }

        .champ-name {
            color: #f0e6d2;
            font-weight: 700;
            letter-spacing: .06em;
        }

        .role-badge {
            background: #0ac8b9;
            color: #010a13;
            font-weight: 700;
        }

        .champ-desc {
            font-size: .92rem;
            line-height: 1.5;
        }

        .search-input {
            background: #091428;
            border: 1px solid #463714;
            color: #f0e6d2;
        }

        .search-input:focus {
            background: #091428;
            color: #f0e6d2;
            border-color: #c8aa6e;
            box-shadow: 0 0 0 .2rem rgba(200, 170, 110, .25);
        }

        .search-input::placeholder {
            color: #5b5a56;
        }

        .champ-id {
            color: #785a28;
            font-size: .75rem;
            letter-spacing: .1em;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <header class="page-header text-center">
            <div class="page-label">League of Legends</div>
            <h1 class="page-title">ADC Champions</h1>
            <div class="divider" aria-hidden="true"><span></span><i></i><span></span></div>
            <p class="page-sub mb-0">Bot Lane Marksmen</p>
        </header>

        <div class="row justify-content-center mb-2">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="search-wrap">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7" />
                        <path d="m20 20-3.5-3.5" />
                    </svg>
                    <input type="search" id="search" class="form-control form-control-lg search-input"
                        placeholder="Search champions..." autocomplete="off">
                </div>
            </div>
        </div>
        <div class="result-count text-center mb-4"><span id="count">25</span> champions</div>
        <div class="row" id="parent"></div>
        <div id="no-results" class="text-center py-5 d-none">No champions found.</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        var champions = [
            { id: 1, name: "Aphelios", description: "A complex marksman who uses five different weapons, each offering unique attacks and abilities.", image: "images02/Aphelios_0.jpg" },
            { id: 2, name: "Ashe", description: "A utility marksman who slows enemies, scouts with Hawkshot, and stuns targets with a global arrow.", image: "images02/Ashe_0.jpg" },
            { id: 3, name: "Caitlyn", description: "A long-range marksman who excels at poking enemies, setting traps, and dealing damage from a distance.", image: "images02/Caitlyn_0.jpg" },
            { id: 4, name: "Corki", description: "A marksman who combines ranged attacks with explosive abilities and mixed physical and magic damage.", image: "images02/Corki_0.jpg" },
            { id: 5, name: "Draven", description: "A high-damage marksman who catches spinning axes to maximize damage and build an early lead.", image: "images02/Draven_0.jpg" },
            { id: 6, name: "Ezreal", description: "A mobile marksman who relies on skillshots, poke damage, and a long-range ultimate.", image: "images02/Ezreal_0.jpg" },
            { id: 7, name: "Jhin", description: "A precise marksman with four shots per magazine who specializes in burst damage and long-range picks.", image: "images02/Jhin_0.jpg" },
            { id: 8, name: "Jinx", description: "A scaling marksman who switches between rockets and a minigun and gains combat power after takedowns.", image: "images02/Jinx_0.jpg" },
            { id: 9, name: "Kai'Sa", description: "An adaptive marksman who combines ranged attacks, burst damage, and mobility to eliminate vulnerable targets.", image: "images02/KaiSa_0.jpg" },
            { id: 10, name: "Kalista", description: "A mobile marksman who hops while attacking and coordinates with her bonded ally.", image: "images02/Kalista_0.jpg" },
            { id: 11, name: "Kog'Maw", description: "A fragile hypercarry who deals sustained damage and excels at shredding durable enemies.", image: "images02/KogMaw_0.jpg" },
            { id: 12, name: "Lucian", description: "An aggressive marksman who uses rapid double shots, mobility, and spell combinations to deal burst damage.", image: "images02/Lucian_0.jpg" },
            { id: 13, name: "Miss Fortune", description: "A lane-focused marksman who pokes enemies and deals massive area damage with her ultimate.", image: "images02/MissFortune_0.jpg" },
            { id: 14, name: "Nilah", description: "A melee-range bot-lane carry who excels at close combat, critical strikes, and teamfight engagement.", image: "images02/Nilah_0.jpg" },
            { id: 15, name: "Samira", description: "An aggressive close-range marksman who chains attacks and abilities before unleashing a powerful spinning ultimate.", image: "images02/Samira_0.jpg" },
            { id: 16, name: "Senna", description: "A long-range marksman who collects souls to increase her range and scaling while providing healing and utility.", image: "images02/Senna_0.jpg" },
            { id: 17, name: "Sivir", description: "A wave-clearing marksman who deals ricocheting damage and helps her team move quickly.", image: "images02/Sivir_0.jpg" },
            { id: 18, name: "Smolder", description: "A scaling dragon marksman who gathers stacks to strengthen his abilities and deal powerful area damage.", image: "images02/Smolder_0.jpg" },
            { id: 19, name: "Tristana", description: "A scaling marksman with increasing attack range, explosive damage, and a jump that can reset after takedowns.", image: "images02/Tristana_0.jpg" },
            { id: 20, name: "Twitch", description: "A stealth-based marksman who surprises enemies and damages multiple targets with piercing ranged attacks.", image: "images02/Twitch_0.jpg" },
            { id: 21, name: "Varus", description: "A versatile marksman who can specialize in poke, attack speed, or on-hit damage.", image: "images02/Varus_0.jpg" },
            { id: 22, name: "Vayne", description: "A mobile duelist who excels at chasing targets and dealing true damage based on enemy maximum health.", image: "images02/Vayne_0.jpg" },
            { id: 23, name: "Xayah", description: "A feather-wielding marksman who deals area damage and can pull back feathers to root enemies.", image: "images02/Xayah_0.jpg" },
            { id: 24, name: "Yunara", description: "A ranged marksman who uses spiritual energy and empowered attacks to deal sustained damage.", image: "images02/Yunara_0.jpg" },
            { id: 25, name: "Zeri", description: "A highly mobile marksman whose primary attack functions like a skillshot and who excels at kiting.", image: "images02/Zeri_0.jpg" }
        ];

        var parent = document.getElementById("parent");
        var searchInput = document.getElementById("search");
        var noResults = document.getElementById("no-results");

        function renderChampions(list) {
            parent.innerHTML = "";
            noResults.classList.toggle("d-none", list.length > 0);
            document.getElementById("count").textContent = list.length;

            for (var i = 0; i < list.length; i++) {
                var c = list[i];
                // Uses the "image" field from the data. If it's empty, a placeholder box is shown.
                var img = c.image
                    ? `<img class="champ-img" src="` + c.image + `" alt="` + c.name + `" loading="lazy">`
                    : `<div class="champ-img"></div>`;

                parent.innerHTML += `
          <div class="col-12 col-md-6 col-lg-4 col-xl-3 mb-4">
            <div class="champ-card shadow">
              ` + img + `
              <div class="p-3 flex-grow-1">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <div class="h4 champ-name mb-0">` + c.name + `</div>
                  <span class="badge role-badge">ADC</span>
                </div>
                <div class="champ-desc">` + c.description + `</div>
              </div>
              <div class="champ-id px-3 pb-2">#` + String(c.id).padStart(2, "0") + `</div>
            </div>
          </div>
        `;
            }
        }

        // Filter by name or description as you type
        searchInput.addEventListener("input", function () {
            var term = searchInput.value.trim().toLowerCase();
            var filtered = champions.filter(function (c) {
                return c.name.toLowerCase().includes(term) || c.description.toLowerCase().includes(term);
            });
            renderChampions(filtered);
        });

        renderChampions(champions);
    </script>

</body>

</html>
